<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley</title>
<style>
  :root { --bg:#f4f1ea; --panel:#fffdf8; --ink:#2b2a27; --muted:#6f6b62; --line:#d8d2c4; --accent:#2f6690; --good:#3a7d44; --bad:#b3402e; --sea:#cfe1ee; --land:#ece5d2; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:baseline; gap:16px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; letter-spacing:.02em; }
  header a { color:var(--accent); text-decoration:none; }
  header .phase { font-weight:600; }
  header .clock { font-variant-numeric:tabular-nums; }
  main { padding:16px 18px; max-width:1500px; margin:0 auto; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:16px; align-items:start; }
  @media (max-width:980px) { .cols { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.big { padding:10px 16px; font-size:16px; }
  button:disabled { opacity:.45; cursor:default; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); max-width:100%; }
  textarea { width:100%; min-height:70px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  label { display:block; margin:8px 0 2px; color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .err { color:var(--bad); margin:6px 0; min-height:1.2em; }
  .board { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; }
  svg { width:100%; height:auto; display:block; max-height:82vh; user-select:none; }
  .prov { stroke:#8f8a7b; stroke-width:1; }
  .prov.sea { fill:var(--sea); } .prov.land { fill:var(--land); }
  .hit { cursor:pointer; }
  .hl { fill:none; stroke:#e0a100; stroke-width:5; pointer-events:none; }
  .sel { fill:none; stroke:#1b1b1b; stroke-width:4; stroke-dasharray:6 4; pointer-events:none; }
  .plabel { font-size:11px; fill:#4b473f; text-anchor:middle; pointer-events:none; }
  .ulabel { font-size:11px; font-weight:700; fill:#fff; text-anchor:middle; pointer-events:none; }
  .seat { display:grid; grid-template-columns:14px 1fr auto; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
  .seat:first-of-type { border-top:0; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .tag { font-size:12px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.ok { color:var(--good); border-color:var(--good); } .tag.wait { color:#9a6b00; border-color:#d9a441; }
  .orders li { margin:2px 0; list-style:none; display:flex; justify-content:space-between; gap:8px; }
  .orders { padding:0; margin:6px 0; }
  .res-ok { color:var(--good); } .res-bad { color:var(--bad); }
  .actions { position:sticky; top:0; z-index:2; background:#fff8dc; border:1px solid #d9a441; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .hist button { padding:2px 7px; font-size:12px; margin:2px 2px 0 0; }
  .hist button.cur { background:var(--ink); color:#fff; border-color:var(--ink); }
  code.gc { display:block; word-break:break-all; font-size:12px; background:#f1eee6; padding:6px; border-radius:6px; }
  .toggle { display:flex; align-items:center; gap:10px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; cursor:pointer; font-size:17px; font-weight:600; background:#fff; width:100%; justify-content:space-between; }
  .toggle .knob { width:52px; height:28px; border-radius:14px; background:#ccc; position:relative; transition:background .15s; flex:none; }
  .toggle .knob::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on { border-color:var(--good); } .toggle.on .knob { background:var(--good); } .toggle.on .knob::after { left:27px; }
  .ann { background:#1f2430; color:#f4f1ea; border-radius:8px; padding:12px 14px; margin-bottom:8px; }
  .ann h3 { margin:0 0 6px; font-size:15px; letter-spacing:.04em; }
  .ann .cur { font-size:18px; font-weight:700; }
  .ann .done { opacity:.75; }
  .ann .res { color:#ffb4a6; }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:4px 6px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1><a href="/">Parley</a></h1>
  <span id="hTitle" class="muted"></span>
  <span id="hPhase" class="phase"></span>
  <span id="hClock" class="clock"></span>
  <span id="hStage" class="muted"></span>
</header>
<main id="app"></main>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const NS = "http://www.w3.org/2000/svg";
const gameId = new URLSearchParams(location.search).get("g");
let token = gameId ? localStorage.getItem("parley-token-" + gameId) : null;
let M = null;          // map
let S = null;          // latest state from the server
let view = null;       // a past phase being looked at, or null for "now"
let last = null;       // the phase resolved most recently (position before it, every order and result)
let ui = { step: null }; // tap sequence in progress
let myOrders = [];     // my private order sheet: never sent to the server until every seal is in
let lastSerial = -1, lastStage = -1, clockBase = 0, clockAt = 0, flash = "", busy = false;

// stages (GameFlow.STAGE_*)
const LOBBY = 0, ORDERS = 1, PAUSED = 2, FINISHED = 3, CLOSING = 4, REVEAL = 5, ANNOUNCE = 6, READY = 7;
const STAGE_TEXT = ["waiting to start", "", "paused", "finished", "time is up: sealing sheets", "opening the sealed orders", "announcing the orders", "waiting for everyone to be ready"];

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await r.text();
  let data = null; try { data = JSON.parse(text); } catch { data = text; }
  if (!r.ok) { const e = new Error(data && data.error ? data.error : "Request failed (" + r.status + ")"); e.status = r.status; throw e; }
  return data;
}
const fmtTime = s => s < 0 ? "no time limit" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const isPurse = () => M && M.rules === "purse";   // the Renaissance ruleset: money, garrisons, sieges
const seasonName = l => {
  if (l === "Lobby") return "Lobby";
  const se = ((M && M.seasons) || []).find(x => x.letter === l[0]);
  const what = { M: isPurse() ? "campaign" : "orders", R: "retreats", A: isPurse() ? "paying the troops" : "builds", X: "game over" }[l.slice(-1)];
  return (se ? se.name : l[0]) + " of year " + l.slice(1, -1) + ", " + what;
};
const unitWord = t => ["Army", "Fleet", "Garrison"][t] || "Unit";
// a walled city is its own space inside a province; on the board it belongs to the province around it
const land = p => (M.provs[p].around >= 0 ? M.provs[p].around : p);
const minutes = v => String(v).split(",").map(x => Math.round(60 * +x.trim())).filter(x => !isNaN(x));

// ------------------------------------------------------------------ SHA-256 (plain JavaScript, so it also works on http:// LAN addresses)
function sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str)), bits = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bits >>> (i * 8)) & 255);
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], W = new Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < bytes.length; off += 64) {
    for (let t = 0; t < 16; t++) W[t] = (bytes[off + 4 * t] << 24) | (bytes[off + 4 * t + 1] << 16) | (bytes[off + 4 * t + 2] << 8) | bytes[off + 4 * t + 3];
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3), s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
const randomSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, "0")).join("");

// ------------------------------------------------------------------ order text in the engine's compact format (GameCodec)
const DIG = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const enc2 = v => DIG[Math.floor(v / 62)] + DIG[v % 62];
const encPower = p => M.powers.length < 61 ? DIG[p + 1] : enc2(p + 1);
function encodeSheet(orders, power) {
  const money = orders.filter(o => o.k === "$").map(o => o.item);
  const units = encodeUnitOrders(orders.filter(o => o.k !== "$"), power);
  return money.length ? units + "!" + money.join(",") : units;
}
function encodeUnitOrders(orders, power) {
  return orders.map(o => {
    switch (o.k) {
      case "x": return enc2(o.u) + "x" + enc2(o.a) + enc2(o.b);
      case "b": return enc2(o.u) + "b";
      case "l": return enc2(o.u) + "l";
      case "m": return enc2(o.u) + (o.via ? "v" : "m") + enc2(o.a);
      case "s": return enc2(o.u) + "s" + enc2(o.a);
      case "t": return enc2(o.u) + "t" + enc2(o.a) + enc2(o.b);
      case "c": return enc2(o.u) + "c" + enc2(o.a) + enc2(o.b);
      case "r": return o.a >= 0 ? enc2(o.u) + enc2(o.a) : "";
      case "ba": return "a" + enc2(o.a) + encPower(power);
      case "bf": return "f" + enc2(o.a) + encPower(power);
      case "d": return "d" + enc2(o.a) + encPower(power);
    }
    return "";
  }).join("");
}
function orderText(o) {
  const L = M.locs, P = M.provs;
  if (o.k === "$") return o.text;
  const unitAt = loc => { const u = S.units.find(x => x.l === loc) || S.dislodged.find(x => x.l === loc); return u ? "AFG"[u.t] : "?"; };
  const who = unitAt(o.u) + " " + (o.u >= 0 ? L[o.u].id : "?");
  switch (o.k) {
    case "m": return who + " - " + L[o.a].id + (o.via ? " via convoy" : "");
    case "s": return who + " S " + P[o.a].id;
    case "t": return who + " S " + P[o.a].id + " - " + L[o.b].id;
    case "c": return who + " C " + P[o.a].id + " - " + P[o.b].id;
    case "r": return o.a >= 0 ? who + " retreats to " + L[o.a].id : who + " disbands";
    case "x": return who + " converts to " + ["an army", "a fleet", "a garrison"][o.b];
    case "b": return who + " besieges the city";
    case "l": return who + " lifts the siege";
    case "ba": return "Build A " + L[o.a].id;
    case "bf": return "Build F " + L[o.a].id;
    case "d": return "Disband the unit in " + P[L[o.a].prov].id;
  }
  return "";
}

// ------------------------------------------------------------------ the private sheet lives in this browser only
const sheetKey = () => "parley-sheet-" + gameId;
function loadSheet() {
  if (!S || !S.sealKey) return;
  let stored = null; try { stored = JSON.parse(localStorage.getItem(sheetKey()) || "null"); } catch { }
  if (!stored || stored.key !== S.sealKey) { stored = { key: S.sealKey, orders: [] }; localStorage.setItem(sheetKey(), JSON.stringify(stored)); }
  myOrders = stored.orders;
}
function saveSheet(extra) {
  let stored = null; try { stored = JSON.parse(localStorage.getItem(sheetKey()) || "null"); } catch { }
  if (!stored || stored.key !== S.sealKey) stored = { key: S.sealKey };
  stored.orders = myOrders;
  Object.assign(stored, extra || {});
  localStorage.setItem(sheetKey(), JSON.stringify(stored));
  return stored;
}
// Submit on: seal the sheet as it is now. Only the seal leaves this browser.
async function sealNow() {
  if (busy || !S.my) return; busy = true; flash = "";
  try {
    const text = encodeSheet(myOrders, S.my.power), salt = randomSalt();
    const seal = sha256Hex("PS1|" + salt + "|" + S.my.power + "|" + S.sealKey + "|" + text);
    saveSheet({ salt, text, seal });
    await api(`/api/games/${gameId}/seal`, { token, sealKey: S.sealKey, seal });
  } catch (e) { flash = e.message; }
  busy = false; await poll();
}
async function unsubmit() {
  if (busy) return; busy = true; flash = "";
  try { await api(`/api/games/${gameId}/unsubmit`, { token }); } catch (e) { flash = e.message; }
  busy = false; await poll();
}
// Every seal is in: open ours. The server checks it against the seal it already has.
async function openNow() {
  if (busy) return; busy = true;
  let stored = null; try { stored = JSON.parse(localStorage.getItem(sheetKey()) || "null"); } catch { }
  try {
    if (!stored || stored.key !== S.sealKey || !stored.salt) throw new Error("this browser does not have the sheet that was sealed (was it sealed on another device?)");
    await api(`/api/games/${gameId}/open`, { token, salt: stored.salt, orders: stored.text });
  } catch (e) { flash = e.message; }
  busy = false; await poll();
}

// ------------------------------------------------------------------ end-of-round sound (a placeholder tone; the real sound is chosen later)
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
      o.start(ctx.currentTime + i * 0.18); o.stop(ctx.currentTime + i * 0.18 + 0.55);
    });
  } catch { }
}

// ------------------------------------------------------------------ home page
async function home() {
  const [maps, games] = await Promise.all([api("/api/maps"), api("/api/games")]);
  const saved = Object.keys(localStorage).filter(k => k.startsWith("parley-archive-"));
  $("#app").innerHTML = `
    <div class="cols"><div>
      <div class="card"><h2>Start a new game</h2>
        <label>Map</label>
        <select id="nMap">${maps.map(m => `<option value="${esc(m.id)}" ${m.isDefault ? "selected" : ""}>${esc(m.name)} (${m.powers} players, ${m.centres} centres)</option>`).join("")}</select>
        <label>Game name</label><input id="nTitle" placeholder="Friday night game" size="30">
        <label>Negotiation minutes per movement phase: first, second, ... (the last number repeats; 0 = no limit)</label>
        <input id="nSched" value="30, 30, 15" size="20">
        <div class="row small" style="margin-top:6px">retreats <input id="nRet" type="number" min="0" step="0.25" value="2" style="width:70px"> min, builds <input id="nAdj" type="number" min="0" step="0.25" value="3" style="width:70px"> min</div>
        <label>Announcement of the orders</label>
        <select id="nAnn"><option value="normal">read out one order at a time</option><option value="fast">fast</option><option value="off">off (show results at once)</option></select>
        <label><input type="checkbox" id="nReady" checked> Everyone presses Ready before each negotiation clock starts</label>
        <label><input type="checkbox" id="nWait"> Wait for players who are away (for slow play-by-Discord games; normally their units just hold)</label>
        <div class="err" id="nErr"></div>
        <button class="primary big" id="nGo">Create game</button>
      </div>
      <div class="card"><h2>Resume from a game code or archive</h2>
        <textarea id="iText" placeholder="Paste a game code (P1...) or a full game archive (PA1;...)"></textarea>
        <div class="err" id="iErr"></div>
        <button id="iGo">Resume</button>
        ${saved.length ? `<p class="small muted">Your browser keeps a copy of every game you play in. Resume one of them:</p>` + saved.map(k => { let v = {}; try { v = JSON.parse(localStorage.getItem(k)); } catch { } return `<div class="row small"><button data-resume="${esc(k)}">Resume</button> ${esc(v.title || "a game")} · ${esc(v.label || "")}</div>`; }).join("") : ""}
      </div>
    </div><div>
      <div class="card"><h2>Games on this server</h2>
        ${games.length ? `<table>${games.map(g => `<tr><td><a href="/?g=${g.id}">${esc(g.title)}</a><div class="small muted">${esc(g.map)}</div></td><td class="small">${esc(g.phase)}</td><td class="small">${g.seats}/${g.powers}</td></tr>`).join("")}</table>` : `<p class="muted">None yet.</p>`}
      </div>
      <div class="card small muted">Parley is an open-source negotiation game. Everyone works on a secret order sheet; the sheets are sealed, opened together, read out and resolved at once. Not even the server sees an order before every sheet is sealed. This flat web version exists for testing rules and maps with friends; the real thing is a VRChat world.</div>
    </div></div>`;
  $("#nGo").onclick = async () => {
    try {
      const r = await api("/api/games", { mapId: $("#nMap").value, title: $("#nTitle").value, moveSchedule: minutes($("#nSched").value), retreatSeconds: Math.round(60 * +$("#nRet").value), adjustSeconds: Math.round(60 * +$("#nAdj").value), announce: $("#nAnn").value, readyUp: $("#nReady").checked, waitForEveryone: $("#nWait").checked });
      location.href = "/?g=" + r.id;
    } catch (e) { $("#nErr").textContent = e.message; }
  };
  const resume = async text => { const r = await api("/api/games/import", { text }); location.href = "/?g=" + r.id; };
  $("#iGo").onclick = async () => { try { await resume($("#iText").value); } catch (e) { $("#iErr").textContent = e.message; } };
  document.querySelectorAll("[data-resume]").forEach(b => b.onclick = async () => {
    try { await resume(JSON.parse(localStorage.getItem(b.dataset.resume)).archive); } catch (e) { $("#iErr").textContent = e.message; }
  });
}

// ------------------------------------------------------------------ game page
async function startGamePage() {
  try { M = await api(`/api/games/${gameId}/map`); }
  catch {
    // the server lost this game (or it was hosted somewhere else): every browser keeps a copy
    let kept = null; try { kept = JSON.parse(localStorage.getItem("parley-archive-" + gameId) || "null"); } catch { }
    $("#app").innerHTML = `<div class="card">This server does not have that game. ${kept ? `Your browser kept a copy (${esc(kept.title)}, ${esc(kept.label)}). <button class="primary" id="kResume">Resume it here</button><div class="err" id="kErr"></div>` : ""} <a href="/">Back</a></div>`;
    if (kept) $("#kResume").onclick = async () => { try { const r = await api("/api/games/import", { text: kept.archive }); location.href = "/?g=" + r.id; } catch (e) { $("#kErr").textContent = e.message; } };
    return;
  }
  M.provs.forEach(p => { p.pts = p.shape ? p.shape : ""; });
  $("#app").innerHTML = `<div class="cols"><div><div id="actions"></div><div id="money"></div><div class="board"><svg id="svg" viewBox="0 0 ${M.width} ${M.height}"></svg></div><div id="below"></div></div><div id="side"></div></div>`;
  await poll();
  setInterval(poll, 1500);
  setInterval(tickClock, 250);
}

async function keepCopy() {
  try {
    const archive = await api(`/api/games/${gameId}/archive`);
    if (archive) localStorage.setItem("parley-archive-" + gameId, JSON.stringify({ title: S.title, label: S.label, archive }));
  } catch { }
}

async function poll() {
  try { S = await api(`/api/games/${gameId}/state?token=${encodeURIComponent(token || "")}`); }
  catch (e) { return; }
  clockBase = S.secondsLeft; clockAt = Date.now();
  if (S.serial !== lastSerial) {
    lastSerial = S.serial; ui = { step: null }; view = null; last = null;
    if (S.historyCount >= 2) { try { last = await api(`/api/games/${gameId}/history/${S.historyCount - 2}`); } catch { } }
    if (S.historyCount > 0) keepCopy();
  }
  if (lastStage === ORDERS && (S.stage === CLOSING || S.stage === REVEAL || S.stage === ANNOUNCE)) chime();
  lastStage = S.stage;
  if (S.my) loadSheet(); else myOrders = [];
  // what a device does by itself: seal whatever is on the sheet when time is up, open it when every seal is in
  if (S.my && !busy) {
    if (S.stage === CLOSING && S.my.needsSeal && !S.my.sealedOrders) { sealNow(); return; }
    if (S.stage === REVEAL && S.my.sealedOrders && !S.my.opened) { openNow(); return; }
  }
  render();
}

function tickClock() {
  if (!S) return;
  let t = clockBase;
  const running = S.stage === ORDERS || S.stage === CLOSING || S.stage === REVEAL || S.stage === ANNOUNCE;
  if (running && t >= 0) t = Math.max(0, clockBase - (Date.now() - clockAt) / 1000);
  $("#hClock").textContent = running || S.stage === PAUSED ? fmtTime(t) : "";
}

function render() {
  $("#hTitle").textContent = S.title + " · " + M.name;
  $("#hPhase").textContent = seasonName(S.stage === ANNOUNCE && S.announce ? S.announce.label : S.label);
  $("#hStage").textContent = STAGE_TEXT[S.stage];
  tickClock();
  drawBoard(); drawSide(); drawActions(); drawMoney(); drawBelow();
}

// ---- board
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e); return e;
}
function provShape(p, cls, parent, extra) {
  const a = Object.assign({ class: cls }, extra || {});
  if (p.svg) { const g = el("g", a, parent); g.innerHTML = p.svg; return g; }
  if (p.pts) return el("polygon", Object.assign(a, { points: p.pts }), parent);
  return el("circle", Object.assign(a, { cx: p.x, cy: p.y, r: 24 }), parent);
}
const powerColor = i => i >= 0 && i < M.powers.length ? M.powers[i].color : "#999";
const canEdit = () => !view && S.my && !S.my.submitted && (S.stage === ORDERS || S.stage === PAUSED);
// while the orders are read out the board still shows the position before them
const reading = () => !view && S.stage === ANNOUNCE && S.announce && S.announce.at < 3 && last;

function highlighted() {
  const set = new Set();
  if (!canEdit() || !S.my.needs) return set;
  const o = S.my.options, L = M.locs;
  if (S.phase === 0) {
    if (!ui.step) o.units.forEach(u => set.add(land(L[u.l].prov)));
    else if (ui.step === "move") ui.unit.moves.forEach(m => set.add(L[m.l].prov));
    else if (ui.step === "sup") ui.unit.sup.forEach(s => set.add(land(s.p)));
    else if (ui.step === "sup2") ui.sup.to.forEach(t => set.add(t < 0 ? land(ui.sup.p) : land(L[t].prov)));
    else if (ui.step === "con") ui.unit.con.forEach(c => set.add(c.p));
    else if (ui.step === "con2") ui.con.to.forEach(t => set.add(t));
  } else if (S.phase === 1) {
    if (!ui.step) o.dis.forEach(d => set.add(L[d.l].prov));
    else if (ui.step === "ret") ui.unit.to.forEach(l => set.add(land(L[l].prov)));
  } else if (S.phase === 2 && !isPurse()) {
    if (S.my.delta > 0) o.builds.forEach(b => set.add(L[b.l].prov));
    else o.disbands.forEach(l => set.add(L[l].prov));
  }
  return set;
}

function drawBoard() {
  const svg = $("#svg"); svg.innerHTML = "";
  const st = view || (reading() ? last : S);
  const defs = el("defs", {}, svg);
  for (const [id, col] of [["ah", "#222"], ["ahg", "#2f7d3f"], ["ahr", "#b3402e"], ["ahb", "#1f5fa0"]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: col }, m);
  }
  if (M.art) { const g = el("g", { "pointer-events": "none" }, svg); g.innerHTML = M.art; }
  if (!M.drawn && !M.art) M.links.forEach(([a, b]) => el("line", { x1: M.provs[a].x, y1: M.provs[a].y, x2: M.provs[b].x, y2: M.provs[b].y, stroke: "#b9b3a4", "stroke-width": 1.5 }, svg));
  const hl = highlighted();
  const flags = st.flags || (S.purse && st === S ? S.purse.flags : null);
  M.provs.forEach((p, i) => {
    if (p.type === 3) return; // a city entry: drawn as the marker of its province
    const s = provShape(p, "prov hit " + (p.type === 2 ? "sea" : "land"), svg, M.art ? { fill: "transparent", stroke: "none" } : {});
    s.addEventListener("click", () => tapProvince(i));
    el("title", {}, s, p.name + (isPurse() ? (p.city ? ` (${p.city === 2 ? "walled " : ""}city worth ${p.income}${p.port ? ", port" : ""})` : "") : (p.sc ? " (supply centre)" : "")));
    const owner = st.owners[i];
    if (owner >= 0 && p.type !== 2) provShape(p, "", svg, { fill: powerColor(owner), "fill-opacity": M.art ? .45 : .32, "pointer-events": "none", stroke: "none" });
  });
  if (M.labels) { const g = el("g", { "pointer-events": "none" }, svg); g.innerHTML = M.labels; }
  M.provs.forEach((p, i) => {
    if (p.type === 3) return;
    if (isPurse()) {
      // the city marker shows who holds the city (which may differ from the province); a thick edge means walls
      const holder = p.node >= 0 ? st.owners[p.node] : st.owners[i];
      if (p.city) el("rect", { x: p.x - 5, y: p.y + 12, width: 10, height: 10, fill: holder >= 0 ? powerColor(holder) : "#fff", stroke: "#333", "stroke-width": p.city === 2 ? 2.4 : 1, "pointer-events": "none" }, svg);
      const f = flags ? flags[i] : 0, cf = flags && p.node >= 0 ? flags[p.node] : 0;
      const marks = (f & 1 ? " famine" : "") + ((f & 2) || (cf & 2) ? " REBELS" : "") + (f & 4 ? " siege" : "");
      el("text", { x: p.x, y: p.y - 13, class: "plabel" }, svg, p.id + marks);
      return;
    }
    if (p.sc && M.art && p.scx >= 0) el("circle", { cx: p.scx, cy: p.scy, r: 7, fill: st.owners[i] >= 0 ? powerColor(st.owners[i]) : "#fff", stroke: "#222", "stroke-width": 2, "pointer-events": "none" }, svg);
    if (p.sc && !M.art) el("rect", { x: p.x - 4, y: p.y + 13, width: 8, height: 8, fill: st.owners[i] >= 0 ? powerColor(st.owners[i]) : "#fff", stroke: "#333", "stroke-width": 1.2, "pointer-events": "none", transform: `rotate(45 ${p.x} ${p.y + 17})` }, svg);
    if (!M.art) el("text", { x: p.x, y: p.y - 13, class: "plabel" }, svg, p.id);
  });
  // arrows: my sheet (now), everybody's (a past phase), or the orders read out so far (announcement)
  let arrows = [];
  if (view) arrows = view.orders.map(o => Object.assign({ col: o.ok ? "g" : "r" }, o));
  else if (reading()) arrows = S.announce.lines.slice(0, S.announce.read).filter(x => x.from >= 0 && x.to >= 0).map(x => ({ k: 1, u: x.from, a: x.to, b: -1, col: "b" }));
  else if (S.stage === ORDERS || S.stage === PAUSED || S.stage === CLOSING || S.stage === REVEAL) arrows = S.phase === 0 || S.phase === 1 ? myOrders.filter(o => o.k !== "$").map(o => ({ k: { m: 1, s: 2, t: 3, c: 4, r: 1, x: 1 }[o.k], u: o.u, a: o.a, b: o.b, col: "" })) : [];
  arrows.forEach(o => {
    if (o.u < 0 || o.a < 0) return;
    const from = M.provs[M.locs[o.u].prov];
    let to, dash = "";
    if (o.k === 1) to = M.provs[M.locs[o.a].prov];
    else if (o.k === 2) { to = M.provs[o.a]; dash = "5 4"; }
    else if (o.k === 3) { if (o.b < 0) return; to = M.provs[M.locs[o.b].prov]; dash = "5 4"; }
    else if (o.k === 4) { to = M.provs[o.a]; dash = "2 4"; }
    else return;
    const dx = to.x - from.x, dy = to.y - from.y, d = Math.hypot(dx, dy) || 1, cut = M.art ? 24 : 15;
    const colour = { g: "#2f7d3f", r: "#b3402e", b: "#1f5fa0" }[o.col] || "#222";
    el("line", { x1: from.x + dx / d * cut, y1: from.y + dy / d * cut, x2: to.x - dx / d * cut, y2: to.y - dy / d * cut, stroke: colour, "stroke-width": 3, "stroke-dasharray": dash, "marker-end": `url(#ah${o.col})`, "pointer-events": "none", opacity: .85 }, svg);
  });
  const mine = S.my ? S.my.power : (S.me ? S.me.power : -1);
  const k = M.art ? 1.6 : 1;
  const drawUnit = (u, dx, dashed) => {
    const p = M.provs[M.locs[u.l].prov], ux = M.locs[u.l].x !== undefined ? M.locs[u.l].x : p.x, uy = M.locs[u.l].y !== undefined ? M.locs[u.l].y : p.y;
    dx *= k; const x = ux + dx, y = uy + 2 * k + dx / 2;
    const a = { fill: powerColor(u.p), stroke: dashed ? "#111" : (u.p === mine ? "#ffd200" : "#fff"), "stroke-width": u.p === mine ? 3 : 2, "pointer-events": "none" };
    if (dashed) a["stroke-dasharray"] = "3 2";
    if (u.t === 1) el("path", Object.assign(a, { d: `M${x - 12 * k},${y + 8 * k} L${x + 12 * k},${y + 8 * k} L${x},${y - 12 * k} z` }), svg);
    else if (u.t === 2) el("rect", Object.assign(a, { x: x - 9 * k, y: y - 9 * k, width: 18 * k, height: 18 * k }), svg);
    else el("circle", Object.assign(a, { cx: x, cy: y, r: 10 * k }), svg);
    el("text", { x, y: y + 4 * k, class: "ulabel", "font-size": 11 * k }, svg, "AFG"[u.t] + (u.c ? "*" : ""));
  };
  st.units.forEach(u => drawUnit(u, 0, false));
  st.dislodged.forEach(u => drawUnit(u, 16, true));
  hl.forEach(i => provShape(M.provs[i], "hl", svg));
  if (ui.unit && !view) provShape(M.provs[land(M.locs[ui.unit.l].prov)], "sel", svg);
}

// ---- tapping (edits the private sheet in this browser only)
function tapProvince(i) {
  if (!canEdit() || !S.my.needs) return;
  if (!highlighted().has(i)) { if (ui.step) { ui = { step: null }; render(); } return; }
  const o = S.my.options, L = M.locs;
  if (S.phase === 0) {
    if (!ui.step) {
      // a province can hold two of my units: one outside and a garrison in the city
      const c = o.units.filter(u => land(L[u.l].prov) === i);
      if (c.length === 1) ui = { step: "unit", unit: c[0] };
      else ui = { step: "pick", pick: c.map(u => ({ label: unitWord(u.t) + " in " + L[u.l].name, act: () => { ui = { step: "unit", unit: u }; render(); } })) };
    }
    else if (ui.step === "move") {
      const c = ui.unit.moves.filter(m => L[m.l].prov === i);
      if (c.length === 1) return setOrder({ k: "m", u: ui.unit.l, a: c[0].l, b: -1, via: c[0].via });
      ui.step = "pick"; ui.pick = c.map(m => ({ label: L[m.l].name + (m.via ? " (by convoy)" : c.some(x => x.via) ? " (over land)" : ""), order: { k: "m", u: ui.unit.l, a: m.l, b: -1, via: m.via } }));
    }
    else if (ui.step === "sup") {
      const c = ui.unit.sup.filter(s => land(s.p) === i), unit = ui.unit;
      if (c.length === 1) { ui.sup = c[0]; ui.step = "sup2"; }
      else { ui.step = "pick"; ui.pick = c.map(s => ({ label: "the unit in " + L[s.p].name, act: () => { ui = { step: "sup2", unit, sup: s }; render(); } })); }
    }
    else if (ui.step === "sup2") {
      const c = [];
      if (land(ui.sup.p) === i && ui.sup.to.includes(-1)) c.push({ label: "it stays where it is", order: { k: "s", u: ui.unit.l, a: ui.sup.p, b: -1 } });
      ui.sup.to.filter(t => t >= 0 && land(L[t].prov) === i).forEach(t => c.push({ label: "it goes to " + L[t].name, order: { k: "t", u: ui.unit.l, a: ui.sup.p, b: t } }));
      if (c.length === 1) return setOrder(c[0].order);
      ui.step = "pick"; ui.pick = c;
    }
    else if (ui.step === "con") { ui.con = ui.unit.con.find(c => c.p === i); ui.step = "con2"; }
    else if (ui.step === "con2") return setOrder({ k: "c", u: ui.unit.l, a: ui.con.p, b: i });
  } else if (S.phase === 1) {
    if (!ui.step) ui = { step: "ret", unit: o.dis.find(d => L[d.l].prov === i) };
    else if (ui.step === "ret") {
      const c = ui.unit.to.filter(l => land(L[l].prov) === i);
      if (c.length === 1) return setOrder({ k: "r", u: ui.unit.l, a: c[0], b: -1 });
      ui.step = "pick"; ui.pick = c.map(l => ({ label: L[l].name, order: { k: "r", u: ui.unit.l, a: l, b: -1 } }));
    }
  } else if (S.phase === 2 && !isPurse()) {
    if (S.my.delta > 0) {
      const c = o.builds.filter(b => L[b.l].prov === i);
      ui = { step: "pick", pick: c.map(b => ({ label: (b.t === 1 ? "Fleet" : "Army") + " in " + L[b.l].name, order: { k: b.t === 1 ? "bf" : "ba", u: -1, a: b.l, b: -1 } })) };
    } else {
      const l = o.disbands.find(x => L[x].prov === i);
      const have = myOrders.findIndex(x => x.k === "d" && L[x.a].prov === i);
      if (have >= 0) myOrders.splice(have, 1); else myOrders.push({ k: "d", u: -1, a: l, b: -1 });
      while (myOrders.length > -S.my.delta) myOrders.shift();
      saveSheet(); return render();
    }
  }
  render();
}

function setOrder(order) {
  const L = M.locs;
  if (S.phase === 2 && !isPurse()) {
    myOrders = myOrders.filter(x => L[x.a].prov !== L[order.a].prov);
    myOrders.push(order);
    while (myOrders.length > S.my.delta) myOrders.shift();
  } else {
    myOrders = myOrders.filter(x => x.k === "$" || x.u !== order.u);
    if (order.k !== "h" && !(order.k === "r" && order.a < 0)) myOrders.push(order);
  }
  ui = { step: null };
  saveSheet();
  render();
}

function drawAnnouncement() {
  const A = S.announce;
  let h = `<div class="ann"><h3>${A.at === 0 ? "The round is over. Back to the map..." : A.at >= 3 ? "Results of " + esc(seasonName(A.label)) : "The orders for " + esc(seasonName(A.label))}</h3>`;
  const news = A.lines.map((x, k) => Object.assign({ k }, x)).filter(x => x.p < 0 && x.k < A.read);
  if (news.length) h += `<div style="margin:6px 0"><b>News</b><div>` + news.map(x => `<div class="${x.k === A.read - 1 && A.at === 2 ? "cur" : "done"}" data-line="${x.k}">${esc(x.text)}</div>`).join("") + `</div></div>`;
  M.powers.forEach((pw, i) => {
    const lines = A.lines.map((x, k) => Object.assign({ k }, x)).filter(x => x.p === i && x.k < A.read);
    const naming = A.atPower === i;
    if (!lines.length && !naming) return;
    h += `<div style="margin:6px 0"><span class="dot" style="display:inline-block;background:${esc(pw.color)}"></span> <b>${esc(pw.name)}</b>${A.status[i] ? ` <span class="small">(${esc(A.status[i])})</span>` : ""}<div>` +
      lines.map(x => `<div class="${x.k === A.read - 1 && A.at === 2 ? "cur" : "done"}" data-line="${x.k}">${esc(x.text)}${A.at >= 3 && x.res ? ` <span class="res">— ${esc(x.res)}</span>` : ""}</div>`).join("") + `</div></div>`;
  });
  return h + `</div>`;
}

function drawActions() {
  const box = $("#actions");
  if (view) { box.innerHTML = `<div class="actions">Looking at <b>${esc(seasonName(view.label))}</b>${view.resolved ? " and what happened in it" : ""}. <button id="vBack">Back to now</button> ${S.isHost && view.index < S.historyCount - 1 ? `<button id="vRoll">Roll the game back to here</button>` : ""}</div>`;
    $("#vBack").onclick = () => { view = null; render(); };
    if ($("#vRoll")) $("#vRoll").onclick = async () => { if (confirm("Roll back? Everything after this phase is discarded.")) { await host({ action: "rollback", index: view.index }); } };
    return; }
  if (S.stage === ANNOUNCE && S.announce) { box.innerHTML = drawAnnouncement(); return; }
  if (S.stage === READY) {
    const me = S.my || (S.me && S.me.power >= 0 ? { power: S.me.power } : null);
    const r = me ? S.seats[me.power].ready : false;
    box.innerHTML = `<div class="actions">Take a break. The next clock starts when everyone has pressed Ready. ${me ? `<button class="${r ? "" : "primary"} big" id="aReady">${r ? "Not ready yet" : "Ready"}</button>` : ""}</div>`;
    if ($("#aReady")) $("#aReady").onclick = async () => { try { await api(`/api/games/${gameId}/ready`, { token, value: !r }); } catch (e) { flash = e.message; } poll(); };
    return;
  }
  if (S.stage === CLOSING || S.stage === REVEAL) { box.innerHTML = `<div class="actions">${S.stage === CLOSING ? "Time is up. Each sheet is being sealed as it stands." : "Every sheet is sealed. Opening them..."}${flash ? `<div class="err">${esc(flash)}</div>` : ""}</div>`; return; }
  if (!S.my || S.stage === LOBBY || S.stage === FINISHED) { box.innerHTML = ""; return; }
  if (S.my.submitted) { box.innerHTML = `<div class="actions">Your orders are sealed and submitted. Switch <b>Submitted</b> off to change them.${flash ? `<div class="err">${esc(flash)}</div>` : ""}</div>`; return; }
  if (!S.my.needs) { box.innerHTML = `<div class="actions">Nothing for you to do this phase.</div>`; return; }
  let h = "";
  const L = M.locs;
  if (ui.step === "unit") {
    const u = ui.unit, name = unitWord(u.t) + " in " + L[u.l].name;
    h = `<b>${esc(name)}:</b> <button data-a="hold">Hold</button> <button data-a="move" ${u.moves.length ? "" : "disabled"}>Move</button> <button data-a="sup" ${u.sup.length ? "" : "disabled"}>Support</button> <button data-a="con" ${u.con.length ? "" : "disabled"}>Convoy</button>${u.conv && u.conv.length ? ` <button data-a="conv">Convert</button>` : ""}${u.siege ? ` <button data-a="besiege">Besiege</button>` : ""}${u.sieging ? ` <button data-a="lift">Lift siege</button>` : ""} <button data-a="x">Cancel</button>`;
  } else if (ui.step === "pick") {
    h = `Which? ` + ui.pick.map((p, i) => `<button data-p="${i}">${esc(p.label)}</button>`).join(" ") + ` <button data-a="x">Cancel</button>`;
  } else if (ui.step === "ret") {
    h = `<b>${esc(unitWord(ui.unit.t) + " in " + L[ui.unit.l].name)}</b> was dislodged. ${ui.unit.to.length ? "Tap where it retreats to, or" : "It has nowhere to go:"} <button data-a="disband">Disband it</button> <button data-a="x">Cancel</button>`;
  } else if (ui.step) {
    h = ({ move: "Tap the destination.", sup: "Tap the unit to support.", sup2: "Tap where that unit is going (tap the unit itself to support it staying put).", con: "Tap the army to carry.", con2: "Tap where the army is going." }[ui.step]) + ` <button data-a="x">Cancel</button>`;
  } else {
    h = S.phase === 2 && isPurse() ? "Winter: every unit you keep costs 3 ducats. Use the treasury panel below to dismiss units or buy new ones; an empty sheet keeps everything you can pay for."
      : S.phase === 0 && isPurse() ? "Tap one of your units to give it an order, and use the treasury panel below for money and expenses. Expenses happen first, then the units move."
      : S.phase === 0 ? "Tap one of your units to give it an order. Units without an order hold. When the clock runs out, whatever is on your sheet is used."
      : S.phase === 1 ? "Tap a dislodged unit (dashed outline) to retreat it. Units without an order are disbanded."
      : S.my.delta > 0 ? `You may build ${S.my.delta} unit${S.my.delta > 1 ? "s" : ""}. Tap a highlighted home centre.`
      : `You must disband ${-S.my.delta} unit${S.my.delta < -1 ? "s" : ""}. Tap the unit${S.my.delta < -1 ? "s" : ""} to remove.`;
  }
  box.innerHTML = `<div class="actions">${h}${flash ? `<div class="err">${esc(flash)}</div>` : ""}</div>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (b.dataset.p !== undefined) { const pick = ui.pick[+b.dataset.p]; return pick.act ? pick.act() : setOrder(pick.order); }
    if (a === "x") { ui = { step: null }; render(); }
    else if (a === "hold") setOrder({ k: "h", u: ui.unit.l });
    else if (a === "besiege") setOrder({ k: "b", u: ui.unit.l, a: -1, b: -1 });
    else if (a === "lift") setOrder({ k: "l", u: ui.unit.l, a: -1, b: -1 });
    else if (a === "conv") {
      const u = ui.unit;
      ui = { step: "pick", unit: u, pick: u.conv.map(c => ({ label: "becomes " + ["an army", "a fleet", "a garrison"][c.t] + " in " + M.locs[c.l].name, order: { k: "x", u: u.l, a: c.l, b: c.t } })) };
      render();
    }
    else if (a === "disband") setOrder({ k: "r", u: ui.unit.l, a: -1 });
    else { ui.step = a; render(); }
  });
}

// ---- the treasury panel (Renaissance ruleset): money orders and expenses go on the same private sheet as the unit orders
let moneySig = "";
const place2 = l => enc2(l);
function addMoney(item, text) {
  if (!canEdit()) return;
  if (item[0] === "E" && myOrders.filter(o => o.k === "$" && o.item[0] === "E").length >= 4) { flash = "At most four expenses per campaign."; return render(); }
  // one repayment, one loan of each length and one gift per power at a time: a new one replaces the old
  const same = o => o.k === "$" && (item[0] === "P" ? o.item[0] === "P" : item[0] === "B" || item[0] === "G" || item[0] === "T" ? o.item.slice(0, 2) === item.slice(0, 2) : item[0] === "D" || item[0] === "N" ? o.item.slice(-2) === item.slice(-2) && o.item[0] === item[0] : false);
  myOrders = myOrders.filter(o => !same(o));
  myOrders.push({ k: "$", item, text });
  flash = ""; saveSheet(); moneySig = ""; render();
}
function drawMoney() {
  const box = $("#money");
  const show = isPurse() && S.my && S.my.needs && !view && (S.stage === ORDERS || S.stage === PAUSED) && (S.phase === 0 || S.phase === 2);
  if (!show) { box.innerHTML = ""; moneySig = ""; return; }
  // redraw only when something changed, so that half-filled forms survive the polling
  const sig = S.serial + "|" + S.my.submitted + "|" + myOrders.length + "|" + S.phase;
  if (sig === moneySig) return;
  moneySig = sig;
  const o = S.my.options, L = M.locs, P = M.provs, edit = canEdit();
  const dis = edit ? "" : "disabled";
  let h = `<div class="card"><h2>Treasury: ${S.phase === 0 ? o.spend.treasury : o.treasury} ducats</h2>`;
  if (S.phase === 2) {
    const upkeep = o.mine.reduce((a, u) => a + u.cost, 0);
    h += `<p class="small">Keeping all ${o.mine.length} units costs ${upkeep} ducats. A new unit costs ${o.unitCost}.</p>
      <div class="row"><select id="mDis">${o.mine.map(u => `<option value="${u.l}">${esc(unitWord(u.t) + " in " + L[u.l].name)}</option>`).join("")}</select><button id="mDisGo" ${dis} ${o.mine.length ? "" : "disabled"}>Dismiss</button></div>
      <div class="row" style="margin-top:6px"><select id="mNew">${o.builds.map(b => `<option value="${b.t}:${b.l}">${esc(unitWord(b.t) + " in " + L[b.l].name)}</option>`).join("")}</select><button id="mNewGo" ${dis} ${o.builds.length ? "" : "disabled"}>Build</button></div>`;
  } else {
    const sp = o.spend;
    if (sp.loans.length) h += `<p class="small">Owed to the bank: ` + sp.loans.map(l => `${l.principal}+${l.interest} due ${l.dueIn <= 0 ? "now" : "in " + l.dueIn + " campaign" + (l.dueIn > 1 ? "s" : "")}`).join("; ") + `</p>`;
    const kinds = [];
    if (sp.bribes.some(b => b.d > 0)) kinds.push(["d", "Bribe a unit to disband"]);
    if (sp.bribes.some(b => b.b > 0)) kinds.push(["b", "Buy a unit"]);
    if (sp.bribes.some(b => b.a > 0)) kinds.push(["g", "Turn a garrison autonomous"]);
    if (sp.bribes.some(b => b.counter)) kinds.push(["c", "Counter-bribe (protect a unit)"]);
    if (sp.rebel.length) kinds.push(["r", "Raise a rebellion"]);
    if (sp.pacify.length) kinds.push(["p", "Pacify a rebellion"]);
    if (sp.relief.length) kinds.push(["f", "Famine relief"]);
    if (sp.kill.length) kinds.push(["a", "Assassinate a ruler"]);
    h += `<div class="row"><select id="xKind">${kinds.map(k => `<option value="${k[0]}">${k[1]}</option>`).join("")}</select><select id="xTarget"></select><input id="xAmt" type="number" min="0" step="3" style="width:64px"><button id="xAdd" ${dis} ${kinds.length ? "" : "disabled"}>Add expense</button></div>
      <div class="row" style="margin-top:6px"><select id="bKind">${sp.canBorrow ? `<option value="B1">Borrow for 1 year (20%)</option><option value="B2">Borrow for 2 years (50%)</option>` : ""}${sp.debt ? `<option value="P">Repay the bank</option>` : ""}<option value="G">Give ducats to</option><option value="T">Hand over my token against</option></select>
      <select id="bWho">${sp.others.map(v => `<option value="${v}">${esc(M.powers[v].name)}</option>`).join("")}</select><select id="bTo">${sp.others.map(v => `<option value="${v}">to ${esc(M.powers[v].name)}</option>`).join("")}</select><input id="bAmt" type="number" min="1" style="width:64px" value="3"><button id="bAdd" ${dis}>Add</button></div>
      <p class="small muted">Up to four expenses, carried out in order before any unit moves. A failed expense costs the same. Tokens against: ${sp.others.filter(v => sp.tokens[v] > 0).map(v => esc(M.powers[v].name)).join(", ") || "none"}.</p>`;
  }
  box.innerHTML = h + `</div>`;
  if (S.phase === 2) {
    if ($("#mDisGo")) $("#mDisGo").onclick = () => { const l = +$("#mDis").value, u = o.mine.find(x => x.l === l); addMoney("D" + place2(l), "Dismiss the " + unitWord(u.t).toLowerCase() + " in " + L[l].name); };
    if ($("#mNewGo")) $("#mNewGo").onclick = () => { const [t, l] = $("#mNew").value.split(":").map(Number); addMoney("N" + t + "0" + place2(l), "Build " + ["an army", "a fleet", "a garrison"][t] + " in " + L[l].name); };
    return;
  }
  const sp = o.spend;
  const unitLabel = b => unitWord(b.t) + " in " + L[b.l].name + " (" + M.powers[b.p].name + ")";
  const targets = kind => kind === "d" ? sp.bribes.filter(b => b.d > 0).map(b => [b.l, unitLabel(b), b.d])
    : kind === "b" ? sp.bribes.filter(b => b.b > 0).map(b => [b.l, unitLabel(b), b.b])
    : kind === "g" ? sp.bribes.filter(b => b.a > 0).map(b => [b.l, unitLabel(b), b.a])
    : kind === "c" ? sp.bribes.filter(b => b.counter).map(b => [b.l, unitLabel(b), 3])
    : kind === "r" ? sp.rebel.map(r => [r.p, P[r.p].name, r.cost])
    : kind === "p" ? sp.pacify.map(q => [q, P[q].name, 12])
    : kind === "f" ? sp.relief.map(q => [q, P[q].name, 3])
    : sp.kill.map(v => [v, M.powers[v].name, 12]);
  const fill = () => {
    const t = targets($("#xKind").value);
    $("#xTarget").innerHTML = t.map((x, i) => `<option value="${i}">${esc(x[1])} — at least ${x[2]}</option>`).join("");
    $("#xAmt").value = t.length ? t[0][2] : 0; $("#xAmt").step = $("#xKind").value === "a" ? 12 : 3;
  };
  if ($("#xKind") && $("#xKind").options.length) {
    fill();
    $("#xKind").onchange = fill;
    $("#xTarget").onchange = () => { const t = targets($("#xKind").value)[+$("#xTarget").value]; if (t) $("#xAmt").value = t[2]; };
    $("#xAdd").onclick = () => {
      const kind = $("#xKind").value, t = targets(kind)[+$("#xTarget").value], n = Math.max(0, Math.floor(+$("#xAmt").value));
      if (!t || !n) return;
      const words = { d: "bribe to disband the ", b: "buy the ", g: "turn autonomous the ", c: "counter-bribe for the ", r: "raise a rebellion in ", p: "pacify ", f: "famine relief for ", a: "assassinate the ruler of " }[kind];
      addMoney("E" + kind + (kind === "a" ? DIG[t[0]] + "0" : place2(t[0])) + n, n + " ducats: " + words + t[1]);
    };
  }
  const bk = () => { const k = $("#bKind").value; $("#bWho").style.display = k === "G" || k === "T" ? "" : "none"; $("#bTo").style.display = k === "T" ? "" : "none"; $("#bAmt").style.display = k === "T" ? "none" : ""; };
  bk(); $("#bKind").onchange = bk;
  $("#bAdd").onclick = () => {
    const k = $("#bKind").value, n = Math.max(0, Math.floor(+$("#bAmt").value)), who = +$("#bWho").value, to = +$("#bTo").value;
    if (k === "B1" || k === "B2") { if (n) addMoney(k + n, "Borrow " + n + " ducats for " + (k === "B1" ? "one year" : "two years")); }
    else if (k === "P") { if (n) addMoney("P" + n, "Repay " + n + " ducats to the bank"); }
    else if (k === "G") { if (n) addMoney("G" + DIG[who] + n, "Give " + n + " ducats to " + M.powers[who].name); }
    else if (k === "T" && who !== to) addMoney("T" + DIG[who] + DIG[to], "Hand my token against " + M.powers[who].name + " to " + M.powers[to].name);
  };
}

// ---- side panel
async function host(body) { try { await api(`/api/games/${gameId}/host`, Object.assign({ token }, body)); } catch (e) { alert(e.message); } lastSerial = -1; await poll(); }

function drawSide() {
  const side = $("#side");
  let h = "";
  if (!S.me) {
    h += `<div class="card"><h2>Join this game</h2><label>Your name</label><div class="row"><input id="jName" maxlength="24"><button class="primary" id="jGo">Join</button></div><div class="err" id="jErr"></div><p class="small muted">You can watch without joining. After joining, this browser remembers you; keep the personal link shown afterwards if you want to play from another device.</p></div>`;
  }
  // my sheet first: it is what a player looks at most
  if (S.my && S.stage !== LOBBY && S.stage !== FINISHED) {
    h += `<div class="card"><h2>Your order sheet (${esc(M.powers[S.my.power].name)})</h2>`;
    const edit = canEdit();
    h += myOrders.length ? `<ul class="orders">${myOrders.map((o, i) => `<li><span>${esc(orderText(o))}</span>${edit ? `<button data-del="${i}" title="Remove">×</button>` : ""}</li>`).join("")}</ul>` : `<p class="muted small">${S.my.needs ? "Nothing entered yet: your units hold." : "Nothing to order this phase."}</p>`;
    if (S.my.needs && (S.stage === ORDERS || S.stage === PAUSED)) h += `<button class="toggle ${S.my.submitted ? "on" : ""}" id="oToggle"><span>${S.my.submitted ? "Submitted" : "Not submitted"}</span><span class="knob"></span></button>`;
    h += `<p class="small muted">Only you can see this sheet. It stays in this browser; the server only receives a sealed fingerprint until every sheet is sealed.</p>`;
    h += `<div class="row"><button id="oDraw">${S.seats[S.my.power].vote ? "Withdraw draw vote" : "Vote for a draw"}</button></div></div>`;
  }
  // seats
  h += `<div class="card"><h2>Powers</h2>`;
  S.seats.forEach(s => {
    const pw = M.powers[s.power];
    if (!s.playable) return; // garrisons that answer to nobody have no seat
    let tags = "";
    if (S.stage === LOBBY) tags = s.name ? "" : (S.me && S.me.power < 0 ? `<button data-seat="${s.power}">Take</button>` : "");
    else if (s.gone) tags = `<span class="tag">out</span>`;
    else if (S.stage === READY) tags = s.name && s.present ? (s.ready ? `<span class="tag ok">ready</span>` : `<span class="tag wait">not ready</span>`) : "";
    else if (S.stage === REVEAL && s.needs) tags = s.opened ? `<span class="tag ok">opened</span>` : `<span class="tag wait">${s.submitted ? "opening" : "no orders"}</span>`;
    else if (S.stage !== FINISHED && s.needs) tags = s.submitted ? `<span class="tag ok">submitted</span>` : `<span class="tag wait">${s.name ? "working" : "no player"}</span>`;
    if (S.stage !== LOBBY && !s.name && S.me && S.me.power < 0 && !s.gone) tags += ` <button data-seat="${s.power}">Take over</button>`;
    else if (S.stage !== LOBBY && s.name && !s.present && S.me && S.me.power < 0 && !s.gone) tags += ` <button data-seat="${s.power}">Take over</button>`;
    if (s.vote) tags += ` <span class="tag">votes draw</span>`;
    if (S.isHost && s.name && S.me && s.name !== S.me.name) tags += ` <button data-free="${s.power}" title="Free this seat">×</button>`;
    h += `<div class="seat"><span class="dot" style="background:${esc(pw.color)}"></span><div><b>${esc(pw.name)}</b>${S.winner === s.power ? " 🏆" : ""}<div class="small muted">${s.name ? esc(s.name) + (s.present || S.stage === LOBBY ? "" : " (away: units hold)") : "nobody"}${S.stage ? (S.purse ? ` · ${S.purse.treasury[s.power]} ducats, ${S.purse.cities[s.power]} cities, ${S.purse.homes[s.power]} home, ${s.units} units` : ` · ${s.centres} centres, ${s.units} units`) : ""}${s.unopened ? ` · <span title="sealed sheets that were never opened">unopened: ${s.unopened}</span>` : ""}</div></div><div>${tags}</div></div>`;
  });
  h += `<p class="small muted">${S.purse ? `Rules: ${esc(S.rules)}. Victory: ${M.victory} cities and ${S.purse.victoryHomes} home countries.` : `Victory: ${M.victory} centres.`} Host: ${esc(S.host || "nobody")}.</p>`;
  if (S.stage === LOBBY && S.me && S.me.power >= 0) h += `<button id="sLeave">Leave my seat</button>`;
  h += `</div>`;
  if (S.stage === FINISHED) h += `<div class="card"><h2>Game over</h2>${S.drawn ? "The players agreed a draw." : S.winner >= 0 ? `<b>${esc(M.powers[S.winner].name)}</b> wins.` : ""}</div>`;
  // host
  if (S.isHost) {
    const nextLabel = { 1: "End the phase now", 2: "End the phase now", 4: "Stop waiting for seals", 5: "Stop waiting for sheets", 6: "Skip the announcement", 7: "Start the clock now" }[S.stage];
    h += `<div class="card"><h2>Host controls</h2><div class="row">`;
    if (S.stage === LOBBY) h += `<button class="primary" id="hStart">Start the game</button>`;
    if (S.stage === ORDERS) h += `<button id="hPause">Pause the clock</button>`;
    if (S.stage === PAUSED) h += `<button class="primary" id="hResume">Resume the clock</button>`;
    if (nextLabel) h += `<button id="hNext">${nextLabel}</button>`;
    h += `</div><label>Negotiation minutes per movement phase (first, second, ...; the last repeats)</label><input id="tS" size="16" value="${esc(S.schedule.map(x => x / 60).join(", "))}">
      <div class="row small" style="margin-top:4px">retreats <input id="tR" type="number" min="0" step="0.25" style="width:60px" value="${S.timers[0] / 60}"> builds <input id="tA" type="number" min="0" step="0.25" style="width:60px" value="${S.timers[1] / 60}"></div>
      <div class="row small" style="margin-top:4px">announcement <select id="tN">${["normal", "fast", "off"].map(v => `<option ${S.announceSpeed === v ? "selected" : ""}>${v}</option>`).join("")}</select>
      <label style="margin:0"><input type="checkbox" id="tY" ${S.readyUp ? "checked" : ""}> ready-up</label> <button id="hTimers">Set</button></div>
      <label><input type="checkbox" id="hWait" ${S.waitForAbsent ? "checked" : ""}> Wait for players who are away</label>
      <p class="small muted">Pause is for real-life interruptions. Unclaimed powers and players who are away hold. Changes to the clock apply from the next phase.</p></div>`;
  }
  // invite + save
  h += `<div class="card"><h2>Invite and save</h2><p class="small">Send friends this page's address: <code>${esc(location.origin + "/?g=" + gameId)}</code></p>`;
  if (token) h += `<p class="small">Your personal link (do not share; it lets you play from another device): <button id="cLink">Copy</button></p>`;
  if (S.code) h += `<p class="small">Game code for this exact position (paste on any Parley server or, later, in the VR world):</p><code class="gc" id="gc">${esc(S.code)}</code><div class="row" style="margin-top:6px"><button id="cCode">Copy code</button><button id="cArch">Copy full archive (with history)</button></div><p class="small muted">This browser also keeps its own copy of the whole game, so it can be resumed even if the server loses it.</p>`;
  h += `</div>`;
  side.innerHTML = h;

  const on = (id, fn) => { const e = $("#" + id); if (e) e.onclick = fn; };
  on("jGo", async () => {
    try { const r = await api(`/api/games/${gameId}/join`, { name: $("#jName").value }); token = r.token; localStorage.setItem("parley-token-" + gameId, token); lastSerial = -1; await poll(); }
    catch (e) { $("#jErr").textContent = e.message; }
  });
  side.querySelectorAll("[data-seat]").forEach(b => b.onclick = async () => { try { await api(`/api/games/${gameId}/seat`, { token, power: +b.dataset.seat }); } catch (e) { alert(e.message); } lastSerial = -1; poll(); });
  side.querySelectorAll("[data-free]").forEach(b => b.onclick = () => { if (confirm("Free this seat? That player's link stops working.")) host({ action: "free", index: +b.dataset.free }); });
  side.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { myOrders.splice(+b.dataset.del, 1); saveSheet(); render(); });
  on("sLeave", async () => { await api(`/api/games/${gameId}/seat`, { token, power: -1 }); poll(); });
  on("oToggle", () => S.my.submitted ? unsubmit() : sealNow());
  on("oDraw", async () => { await api(`/api/games/${gameId}/draw`, { token, value: !S.seats[S.my.power].vote }); poll(); });
  on("hStart", () => host({ action: "start" })); on("hPause", () => host({ action: "pause" }));
  on("hResume", () => host({ action: "resume" }));
  on("hNext", () => { if (S.stage > 2 || confirm("End this phase now? Whatever is on each sheet is sealed and used.")) host({ action: "next" }); });
  on("hTimers", () => host({ action: "timers", moveSchedule: minutes($("#tS").value), retreatSeconds: Math.round(60 * +$("#tR").value), adjustSeconds: Math.round(60 * +$("#tA").value), announce: $("#tN").value, readyUp: $("#tY").checked }));
  const w = $("#hWait"); if (w) w.onchange = () => host({ action: "wait", value: w.checked });
  const copy = async (text, btn) => { try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; } catch { prompt("Copy this:", text); } };
  on("cCode", e => copy(S.code, e.target));
  on("cArch", async e => copy(await api(`/api/games/${gameId}/archive`), e.target));
  on("cLink", e => copy(location.origin + "/?g=" + gameId + "&t=" + token, e.target));
}

// ---- below the board: results and history
function drawBelow() {
  const box = $("#below");
  const entry = view || (S.stage === ANNOUNCE ? null : last);
  let h = "";
  if (entry && entry.orders.length) {
    h += `<div class="card" id="results"><h2>${view ? "Orders in " : "What just happened: "}${esc(seasonName(entry.label))}</h2>`;
    M.powers.forEach((pw, i) => {
      const mine = entry.orders.filter(o => o.p === i);
      const note = !view && S.announce && S.announce.status[i] ? ` <span class="small muted">(${esc(S.announce.status[i])})</span>` : "";
      if (!mine.length) return;
      h += `<div style="margin:6px 0"><span class="dot" style="display:inline-block;background:${esc(pw.color)}"></span> <b>${esc(pw.name)}</b>${note}<div class="small">` +
        mine.map(o => `${esc(o.text)} <span class="${o.ok ? "res-ok" : "res-bad"}">${o.res === "ok" ? "" : "— " + esc(o.res)}</span>`).join("<br>") + `</div></div>`;
    });
    h += `</div>`;
  }
  if (S.historyCount > 0) {
    h += `<div class="card hist"><h2>History (tap a phase to look at it)</h2>`;
    for (let i = 0; i < S.historyCount; i++) h += `<button data-h="${i}" class="${view && view.index === i ? "cur" : ""}">${i + 1}</button>`;
    h += `</div>`;
  }
  if (M.credit) h += `<p class="small muted">${esc(M.credit)} ${esc(M.license || "")}</p>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-h]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.h;
    if (i === S.historyCount - 1) { view = null; render(); return; }
    try { view = await api(`/api/games/${gameId}/history/${i}`); ui = { step: null }; render(); } catch { }
  });
}

// personal link: /?g=ID&t=TOKEN
const linkToken = new URLSearchParams(location.search).get("t");
if (gameId && linkToken) { localStorage.setItem("parley-token-" + gameId, linkToken); location.replace("/?g=" + gameId); }
else if (gameId) startGamePage(); else home();
</script>
</body>
</html>
